<!--
  ЗАМЕНА для:
    <div class="wireframe" aria-hidden="true"></div>

  Вставь этот блок вместо него в prime_ui.html.
  Кнопки pause/play используют стили .btn-secondary/.btn-primary
  которые уже есть на странице.
-->

<div class="wireframe" style="position:relative; overflow:hidden; padding:0; border:none; background:none;">
  <canvas id="tesseractCanvas" style="display:block; width:100%; height:100%; min-height:280px;"></canvas>

  <div style="position:absolute; bottom:14px; right:14px; display:flex; gap:8px; z-index:3;">
    <button id="tess-pause-btn" class="btn-secondary" type="button"
      style="padding:8px 16px; font-size:13px; border-radius:999px;">⏸ Pause</button>
    <button id="tess-play-btn" class="btn-primary" type="button"
      style="padding:8px 16px; font-size:13px; border-radius:999px; display:none;">▶ Play</button>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('tesseractCanvas');
  const ctx = canvas.getContext('2d');
  let paused = false;
  let pausedAt = 0;
  let timeOffset = 0;

  document.getElementById('tess-pause-btn').addEventListener('click', function () {
    if (!paused) {
      paused = true;
      pausedAt = performance.now();
      this.style.display = 'none';
      document.getElementById('tess-play-btn').style.display = '';
    }
  });
  document.getElementById('tess-play-btn').addEventListener('click', function () {
    if (paused) {
      timeOffset += performance.now() - pausedAt;
      paused = false;
      this.style.display = 'none';
      document.getElementById('tess-pause-btn').style.display = '';
      requestAnimationFrame(draw);
    }
  });

  function resizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = Math.floor(rect.width * dpr);
    canvas.height = Math.floor(rect.height * dpr);
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  const vertices = [];
  for (let i = 0; i < 16; i++) {
    vertices.push([
      (i & 1) ? 1 : -1,
      (i & 2) ? 1 : -1,
      (i & 4) ? 1 : -1,
      (i & 8) ? 1 : -1,
    ]);
  }

  const edges = [];
  for (let i = 0; i < 16; i++) {
    for (let j = 0; j < 4; j++) {
      const k = i ^ (1 << j);
      if (i < k) edges.push([i, k]);
    }
  }

  function rotate4D(p, a, b, angle) {
    const v = p.slice();
    const c = Math.cos(angle), s = Math.sin(angle);
    const pa = v[a], pb = v[b];
    v[a] = pa * c - pb * s;
    v[b] = pa * s + pb * c;
    return v;
  }

  function project(p) {
    const d4 = 3.1, d3 = 5.0;
    const wf = d4 / (d4 - p[3]);
    const x3 = p[0] * wf, y3 = p[1] * wf, z3 = p[2] * wf;
    const zf = d3 / (d3 - z3);
    return [x3 * zf, y3 * zf, z3];
  }

  function draw(t) {
    if (paused) return;
    const effective = t - timeOffset;

    const W = canvas.clientWidth, H = canvas.clientHeight;
    ctx.clearRect(0, 0, W, H);

    const glow = ctx.createRadialGradient(W * 0.5, H * 0.45, 10, W * 0.5, H * 0.45, Math.max(W, H) * 0.62);
    glow.addColorStop(0,    'rgba(66, 232, 122, 0.13)');
    glow.addColorStop(0.35, 'rgba(61, 184, 122, 0.07)');
    glow.addColorStop(0.7,  'rgba(90, 244, 154, 0.04)');
    glow.addColorStop(1,    'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    const a1 = effective * 0.0007;
    const a2 = effective * 0.00047;
    const a3 = effective * 0.00082;

    const proj = vertices.map(v => {
      let p = rotate4D(v, 0, 3, a1);
      p = rotate4D(p, 1, 2, a2);
      p = rotate4D(p, 0, 1, a3);
      return project(p);
    });

    // Фиксированный scale, уменьшен на 30% (0.19 * 0.7 ≈ 0.133)
    const scale = Math.min(W, H) * 0.133;

    const cx = W / 2, cy = H / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(66, 232, 122, 0.55)';
    ctx.shadowBlur = 16;

    edges.forEach(([a, b]) => {
      const p1 = proj[a], p2 = proj[b];
      const depth = (p1[2] + p2[2]) * 0.5;
      ctx.globalAlpha = Math.max(0.15, Math.min(0.88, 0.32 + depth * 0.09));
      ctx.strokeStyle = 'rgba(90, 244, 154, 0.92)';
      ctx.beginPath();
      ctx.moveTo(p1[0] * scale, p1[1] * scale);
      ctx.lineTo(p2[0] * scale, p2[1] * scale);
      ctx.stroke();
    });

    ctx.globalAlpha = 0.28;
    proj.forEach(p => {
      const r = 2.0 + (p[2] + 1.5) * 0.6;
      const g = ctx.createRadialGradient(
        p[0] * scale, p[1] * scale, 0,
        p[0] * scale, p[1] * scale, r * 4
      );
      g.addColorStop(0,    'rgba(200, 255, 220, 0.95)');
      g.addColorStop(0.35, 'rgba(90, 244, 154, 0.9)');
      g.addColorStop(1,    'rgba(66, 232, 122, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p[0] * scale, p[1] * scale, r * 3.5, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.restore();
    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
})();
</script>
